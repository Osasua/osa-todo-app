<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✨ Pro To-Do</title>

<!-- PWA Meta Tags -->
<meta name="theme-color" content="#667eea">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pro To-Do">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    :root {
        --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #d946a8 100%);
        --card-bg: #f8f9fa;
        --text-primary: #1a202c;
        --text-secondary: #718096;
        --input-bg: #ffffff;
        --input-border: #e2e8f0;
        --accent-color: #667eea;
        --accent-gradient: linear-gradient(135deg, #667eea, #764ba2);
        --danger: #e53e3e;
        --success: #38a169;
        --warning: #d69e2e;
        --priority-high: #e53e3e;
        --priority-medium: #d69e2e;
        --priority-low: #38a169;
    }

    body.dark-mode {
        --bg-gradient: linear-gradient(135deg, #1a202c 0%, #2d3748 50%, #4a5568 100%);
        --card-bg: #2d3748;
        --text-primary: #f7fafc;
        --text-secondary: #a0aec0;
        --input-bg: #1a202c;
        --input-border: #4a5568;
        --accent-color: #9f7aea;
        --accent-gradient: linear-gradient(135deg, #9f7aea, #b794f4);
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: var(--bg-gradient);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        color: var(--text-primary);
    }

    .app-card {
        background: var(--card-bg);
        border-radius: 24px;
        padding: 36px 40px;
        width: 100%;
        max-width: 560px;
        box-shadow: 0 25px 80px rgba(0,0,0,0.15);
    }

    .app-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 28px;
    }

    .app-title {
        font-size: 2rem;
        font-weight: 800;
        color: #5a67d8;
        margin-bottom: 4px;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    body.dark-mode .app-title { color: #9f7aea; }

    .app-subtitle {
        font-size: 0.9rem;
        color: var(--text-secondary);
        font-weight: 500;
    }

    .header-right {
        display: flex;
        align-items: center;
        gap: 14px;
    }

    .progress-ring-wrap {
        position: relative;
        width: 52px;
        height: 52px;
    }

    .progress-ring { transform: rotate(-90deg); }

    .progress-ring-bg {
        fill: none;
        stroke: var(--input-border);
        stroke-width: 5;
    }

    .progress-ring-fill {
        fill: none;
        stroke: var(--accent-color);
        stroke-width: 5;
        stroke-linecap: round;
        stroke-dasharray: 138.23;
        stroke-dashoffset: 138.23;
        transition: stroke-dashoffset 0.8s ease;
    }

    .progress-text {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 0.75rem;
        font-weight: 700;
        color: var(--text-primary);
    }

    .theme-btn {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        border: 2px solid var(--input-border);
        background: var(--input-bg);
        font-size: 1.2rem;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
    }

    .theme-btn:hover { transform: rotate(20deg) scale(1.08); }

    .input-row {
        display: flex;
        gap: 10px;
        margin-bottom: 14px;
    }

    .input-row input[type="text"] {
        flex: 2;
        padding: 13px 16px;
        background: var(--input-bg);
        border: 2px solid var(--input-border);
        border-radius: 12px;
        font-size: 14px;
        color: var(--text-primary);
        transition: all 0.25s ease;
    }

    .input-row input[type="text"]:focus {
        outline: none;
        border-color: var(--accent-color);
    }

    .input-row input[type="text"]::placeholder { color: var(--text-secondary); }

    .priority-select {
        flex: 1;
        padding: 13px 14px;
        background: var(--input-bg);
        border: 2px solid var(--input-border);
        border-radius: 12px;
        font-size: 14px;
        color: var(--text-primary);
        cursor: pointer;
        font-weight: 600;
    }

    .priority-select:focus { outline: none; border-color: var(--accent-color); }

    .add-btn {
        padding: 13px 22px;
        background: var(--accent-gradient);
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.25s ease;
        box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
    }

    .add-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 18px rgba(102, 126, 234, 0.4);
    }

    .sla-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 16px;
        background: var(--input-bg);
        border: 2px solid var(--input-border);
        border-radius: 12px;
        margin-bottom: 14px;
        font-size: 14px;
        color: var(--text-primary);
    }

    .sla-row label {
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        font-weight: 600;
        flex: 1;
    }

    .sla-row input[type="checkbox"] {
        width: 18px;
        height: 18px;
        accent-color: var(--accent-color);
        cursor: pointer;
    }

    .sla-row input[type="datetime-local"] {
        flex: 1;
        padding: 8px 12px;
        background: var(--card-bg);
        border: 2px solid var(--input-border);
        border-radius: 8px;
        font-size: 13px;
        color: var(--text-primary);
    }

    .hidden { display: none !important; }

    .search-row {
        position: relative;
        margin-bottom: 18px;
    }

    .search-row input {
        width: 100%;
        padding: 12px 16px 12px 42px;
        background: var(--input-bg);
        border: 2px solid var(--input-border);
        border-radius: 12px;
        font-size: 14px;
        color: var(--text-primary);
    }

    .search-row input:focus {
        outline: none;
        border-color: var(--accent-color);
    }

    .search-icon {
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 16px;
    }

    .filters {
        display: flex;
        justify-content: center;
        gap: 8px;
        margin-bottom: 24px;
    }

    .filter-btn {
        padding: 9px 20px;
        background: var(--input-bg);
        color: var(--text-primary);
        border: 2px solid var(--input-border);
        border-radius: 50px;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.25s ease;
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .filter-btn:hover { transform: translateY(-1px); }

    .filter-btn.active {
        background: var(--accent-gradient);
        color: white;
        border-color: transparent;
        box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
    }

    .todo-list {
        list-style: none;
        min-height: 80px;
        margin-bottom: 20px;
    }

    .todo-list li {
        background: var(--input-bg);
        padding: 14px 16px;
        border-radius: 12px;
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        gap: 12px;
        border: 1px solid var(--input-border);
        transition: all 0.3s ease;
        position: relative;
    }

    .todo-list li:hover {
        transform: translateX(3px);
        box-shadow: 0 4px 14px rgba(0,0,0,0.1);
    }

    .todo-list li::before {
        content: '';
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 5px;
        border-radius: 12px 0 0 12px;
    }

    .priority-high::before { background: var(--priority-high); }
    .priority-medium::before { background: var(--priority-medium); }
    .priority-low::before { background: var(--priority-low); }

    .todo-list li.completed { opacity: 0.6; }
    .todo-list li.completed .task-title { text-decoration: line-through; }

    .task-content {
        flex: 1;
        min-width: 0;
        cursor: pointer;
    }

    .task-title {
        font-size: 15px;
        font-weight: 600;
        color: var(--text-primary);
        word-break: break-word;
    }

    .task-desc {
        font-size: 12px;
        color: var(--text-secondary);
        margin-top: 2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .priority-badge {
        font-size: 0.65rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        padding: 4px 10px;
        border-radius: 20px;
        flex-shrink: 0;
    }

    .priority-high .priority-badge { 
        background: rgba(229, 62, 62, 0.15); 
        color: var(--priority-high);
        border: 1px solid rgba(229, 62, 62, 0.3);
    }
    .priority-medium .priority-badge { 
        background: rgba(214, 158, 46, 0.15); 
        color: var(--priority-medium);
        border: 1px solid rgba(214, 158, 46, 0.3);
    }
    .priority-low .priority-badge { 
        background: rgba(56, 161, 105, 0.15); 
        color: var(--priority-low);
        border: 1px solid rgba(56, 161, 105, 0.3);
    }

    .sla-timer {
        font-size: 0.7rem;
        font-weight: 700;
        padding: 5px 12px;
        border-radius: 20px;
        white-space: nowrap;
        flex-shrink: 0;
        background: rgba(56, 161, 105, 0.15);
        color: var(--success);
        border: 1px solid rgba(56, 161, 105, 0.3);
    }

    .sla-breached {
        background: rgba(229, 62, 62, 0.15);
        color: var(--danger);
        border: 1px solid rgba(229, 62, 62, 0.3);
        animation: pulse 1s infinite;
    }

    @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.6; }
    }

    .action-btn {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        border: 2px solid var(--input-border);
        background: var(--input-bg);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        transition: all 0.2s;
        flex-shrink: 0;
    }

    .edit-btn { color: var(--accent-color); }
    .edit-btn:hover { background: var(--accent-color); color: white; transform: scale(1.1); }
    .delete-btn { color: var(--danger); }
    .delete-btn:hover { background: var(--danger); color: white; transform: rotate(90deg); }

    .footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-top: 18px;
        border-top: 2px solid var(--input-border);
    }

    .items-count {
        font-size: 13px;
        color: var(--text-secondary);
        font-weight: 600;
    }

    .clear-btn {
        padding: 9px 16px;
        background: var(--input-bg);
        color: var(--text-secondary);
        border: 2px solid var(--input-border);
        border-radius: 10px;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.25s ease;
    }

    .clear-btn:hover {
        background: var(--danger);
        color: white;
        border-color: var(--danger);
    }

    /* EDIT MODAL */
    .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(5px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 2000;
    }

    .modal-overlay.active { display: flex; animation: fadeIn 0.2s ease; }

    @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }

    .modal {
        background: var(--card-bg);
        padding: 30px;
        border-radius: 20px;
        width: 90%;
        max-width: 450px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        animation: slideUp 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes slideUp {
        from { transform: translateY(20px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
    }

    .modal h2 {
        margin-bottom: 20px;
        font-size: 1.5rem;
        color: var(--text-primary);
    }

    .modal-field { margin-bottom: 16px; }

    .modal-field label {
        display: block;
        font-size: 12px;
        font-weight: 700;
        color: var(--text-secondary);
        margin-bottom: 6px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    .modal-field input,
    .modal-field select,
    .modal-field textarea {
        width: 100%;
        padding: 12px 14px;
        background: var(--input-bg);
        border: 2px solid var(--input-border);
        border-radius: 10px;
        font-size: 14px;
        color: var(--text-primary);
        font-family: inherit;
    }

    .modal-field textarea {
        resize: vertical;
        min-height: 80px;
    }

    .modal-field input:focus,
    .modal-field select:focus,
    .modal-field textarea:focus {
        outline: none;
        border-color: var(--accent-color);
    }

    .modal-actions {
        display: flex;
        gap: 12px;
        margin-top: 24px;
    }

    .modal-actions button {
        flex: 1;
        padding: 14px;
        border: none;
        border-radius: 12px;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.2s;
    }

    .btn-cancel {
        background: var(--input-bg);
        color: var(--text-primary);
        border: 2px solid var(--input-border) !important;
    }

    .btn-cancel:hover { background: var(--input-border); }

    .btn-save {
        background: var(--accent-gradient);
        color: white;
    }

    .btn-save:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    /* ALARM MODAL */
    .alarm-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.8);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 3000;
    }

    .alarm-overlay.active { display: flex; }

    .alarm-modal {
        background: var(--card-bg);
        padding: 40px;
        border-radius: 24px;
        text-align: center;
        animation: alarmPulse 1s infinite;
    }

    @keyframes alarmPulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.02); }
    }

    .alarm-icon { font-size: 4rem; margin-bottom: 16px; }

    .alarm-title {
        font-size: 1.8rem;
        font-weight: 800;
        color: var(--danger);
        margin-bottom: 8px;
    }

    .alarm-text {
        font-size: 1.1rem;
        color: var(--text-secondary);
        margin-bottom: 24px;
    }

    .alarm-task {
        background: var(--input-bg);
        padding: 16px;
        border-radius: 12px;
        margin-bottom: 24px;
        font-weight: 600;
        color: var(--text-primary);
        border-left: 4px solid var(--danger);
    }

    .alarm-buttons {
        display: flex;
        gap: 12px;
        justify-content: center;
    }

    .alarm-btn {
        padding: 14px 28px;
        border: none;
        border-radius: 12px;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.25s;
        color: white;
    }

    .snooze-btn { background: var(--warning); }
    .snooze-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(214, 158, 46, 0.4); }

    .dismiss-btn { background: var(--danger); }
    .dismiss-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(229, 62, 62, 0.4); }

    /* Install Prompt */
    .install-prompt {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--card-bg);
        padding: 16px 24px;
        border-radius: 16px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        display: none;
        align-items: center;
        gap: 12px;
        z-index: 4000;
        animation: slideUp 0.4s ease;
    }

    .install-prompt.show { display: flex; }

    .install-prompt button {
        padding: 8px 16px;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
    }

    .install-btn {
        background: var(--accent-gradient);
        color: white;
    }

    .dismiss-install {
        background: var(--input-bg);
        color: var(--text-primary);
    }

    @media (max-width: 520px) {
        .app-card { padding: 24px; border-radius: 20px; }
        .app-title { font-size: 1.6rem; }
        .input-row { flex-wrap: wrap; }
        .input-row input[type="text"] { flex: 1 1 100%; }
        .priority-select, .add-btn { flex: 1; }
    }
</style>
</head>
<body>

<div class="app-card">
    <header class="app-header">
        <div>
            <h1 class="app-title"><span class="sparkle">✨</span> My Tasks</h1>
            <p class="app-subtitle">Stay productive, stay awesome</p>
        </div>
        <div class="header-right">
            <div class="progress-ring-wrap">
                <svg class="progress-ring" width="52" height="52">
                    <circle class="progress-ring-bg" cx="26" cy="26" r="22"/>
                    <circle class="progress-ring-fill" id="progress-fill" cx="26" cy="26" r="22"/>
                </svg>
                <span class="progress-text" id="progress-text">0%</span>
            </div>
            <button class="theme-btn" id="theme-toggle">🌙</button>
        </div>
    </header>

    <div class="input-row">
        <input type="text" id="todo-input" placeholder="What needs to be done?">
        <select class="priority-select" id="priority-select">
            <option value="low">🟢 Low</option>
            <option value="medium" selected> Medium</option>
            <option value="high"> High</option>
        </select>
        <button class="add-btn" id="add-btn">+ Add</button>
    </div>

    <div class="sla-row">
        <label>
            <input type="checkbox" id="sla-toggle">
            <span> Set Deadline (with alarm)</span>
        </label>
        <input type="datetime-local" id="sla-input" class="hidden">
    </div>

    <div class="search-row">
        <span class="search-icon">🔍</span>
        <input type="text" id="search-input" placeholder="Search tasks...">
    </div>

    <div class="filters">
        <button class="filter-btn active" data-filter="all">📋 All</button>
        <button class="filter-btn" data-filter="active">⚡ Active</button>
        <button class="filter-btn" data-filter="done">✅ Done</button>
    </div>

    <ul class="todo-list" id="todo-list"></ul>

    <div class="footer">
        <span class="items-count" id="items-left">0 items left</span>
        <button class="clear-btn" id="clear-btn">️ Clear Done</button>
    </div>
</div>

<!-- Install Prompt -->
<div class="install-prompt" id="install-prompt">
    <span>📲 Install Pro To-Do?</span>
    <button class="install-btn" id="install-btn">Install</button>
    <button class="dismiss-install" id="dismiss-install">Not now</button>
</div>

<!-- EDIT MODAL -->
<div class="modal-overlay" id="edit-modal">
    <div class="modal">
        <h2 id="modal-title">Edit Task</h2>
        <div class="modal-field">
            <label>Title</label>
            <input type="text" id="edit-title" placeholder="Task title">
        </div>
        <div class="modal-field">
            <label>Description</label>
            <textarea id="edit-desc" placeholder="Add details, steps, or notes..."></textarea>
        </div>
        <div style="display:flex; gap:12px;">
            <div class="modal-field" style="flex:1;">
                <label>Priority</label>
                <select id="edit-priority">
                    <option value="low">🟢 Low</option>
                    <option value="medium">🟡 Medium</option>
                    <option value="high"> High</option>
                </select>
            </div>
            <div class="modal-field" style="flex:1;">
                <label>Deadline</label>
                <input type="datetime-local" id="edit-deadline">
            </div>
        </div>
        <div class="modal-actions">
            <button class="btn-cancel" id="edit-cancel">Cancel</button>
            <button class="btn-save" id="edit-save">Save Changes</button>
        </div>
    </div>
</div>

<!-- ALARM MODAL -->
<div class="alarm-overlay" id="alarm-modal">
    <div class="alarm-modal">
        <div class="alarm-icon">🔔</div>
        <h2 class="alarm-title">Task Due!</h2>
        <p class="alarm-text" id="alarm-message">Your deadline has arrived</p>
        <div class="alarm-task" id="alarm-task">Task name</div>
        <div class="alarm-buttons">
            <button class="alarm-btn snooze-btn" id="snooze-btn">⏰ Snooze 5min</button>
            <button class="alarm-btn dismiss-btn" id="dismiss-btn">✓ Dismiss</button>
        </div>
    </div>
</div>

<script>
class TodoApp {
    constructor() {
        this.todos = JSON.parse(localStorage.getItem('todos_v7')) || [];
        this.filter = 'all';
        this.searchTerm = '';
        this.editingId = null;
        this.alarms = new Map();
        this.audioCtx = null;
        this.alarmInterval = null;
        this.deferredPrompt = null;

        this.els = {
            input: document.getElementById('todo-input'),
            priority: document.getElementById('priority-select'),
            addBtn: document.getElementById('add-btn'),
            slaToggle: document.getElementById('sla-toggle'),
            slaInput: document.getElementById('sla-input'),
            search: document.getElementById('search-input'),
            list: document.getElementById('todo-list'),
            itemsLeft: document.getElementById('items-left'),
            clearBtn: document.getElementById('clear-btn'),
            themeBtn: document.getElementById('theme-toggle'),
            progressFill: document.getElementById('progress-fill'),
            progressText: document.getElementById('progress-text'),
            filterBtns: document.querySelectorAll('.filter-btn'),
            installPrompt: document.getElementById('install-prompt'),
            installBtn: document.getElementById('install-btn'),
            dismissInstall: document.getElementById('dismiss-install'),
            
            editModal: document.getElementById('edit-modal'),
            editTitle: document.getElementById('edit-title'),
            editDesc: document.getElementById('edit-desc'),
            editPriority: document.getElementById('edit-priority'),
            editDeadline: document.getElementById('edit-deadline'),
            editSave: document.getElementById('edit-save'),
            editCancel: document.getElementById('edit-cancel'),
            
            alarmModal: document.getElementById('alarm-modal'),
            alarmMessage: document.getElementById('alarm-message'),
            alarmTask: document.getElementById('alarm-task'),
            snoozeBtn: document.getElementById('snooze-btn'),
            dismissBtn: document.getElementById('dismiss-btn'),
        };

        this.bindEvents();
        this.setupPWA();
        this.render();
        this.startAlarmChecker();
    }

    setupPWA() {
        // Handle install prompt
        window.addEventListener('beforeinstallprompt', e => {
            e.preventDefault();
            this.deferredPrompt = e;
            this.els.installPrompt.classList.add('show');
        });

        this.els.installBtn.addEventListener('click', async () => {
            if (this.deferredPrompt) {
                this.deferredPrompt.prompt();
                const { outcome } = await this.deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    this.showToast('✅ App installed successfully!');
                }
                this.deferredPrompt = null;
                this.els.installPrompt.classList.remove('show');
            }
        });

        this.els.dismissInstall.addEventListener('click', () => {
            this.els.installPrompt.classList.remove('show');
        });

        window.addEventListener('appinstalled', () => {
            this.els.installPrompt.classList.remove('show');
            this.deferredPrompt = null;
        });
    }

    bindEvents() {
        this.els.addBtn.addEventListener('click', () => this.addTodo());
        this.els.input.addEventListener('keypress', e => { if (e.key === 'Enter') this.addTodo(); });

        this.els.slaToggle.addEventListener('change', () => {
            this.els.slaInput.classList.toggle('hidden', !this.els.slaToggle.checked);
            if (this.els.slaToggle.checked) this.els.slaInput.focus();
        });

        this.els.search.addEventListener('input', e => {
            this.searchTerm = e.target.value.toLowerCase();
            this.render();
        });

        this.els.filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                this.els.filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                this.filter = btn.dataset.filter;
                this.render();
            });
        });

        this.els.clearBtn.addEventListener('click', () => {
            const doneTasks = this.todos.filter(t => t.completed || (t.deadline && t.deadline <= Date.now()));
            if (doneTasks.length > 0 && confirm(`Clear ${doneTasks.length} done/expired task(s)?`)) {
                this.todos = this.todos.filter(t => !t.completed && (!t.deadline || t.deadline > Date.now()));
                this.save();
                this.render();
            }
        });

        this.els.themeBtn.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            this.els.themeBtn.textContent = document.body.classList.contains('dark-mode') ? '☀️' : '🌙';
        });

        this.els.editCancel.addEventListener('click', () => this.closeEditModal());
        this.els.editSave.addEventListener('click', () => this.saveEdit());
        this.els.editModal.addEventListener('click', e => {
            if (e.target === this.els.editModal) this.closeEditModal();
        });

        this.els.snoozeBtn.addEventListener('click', () => this.snoozeAlarm(5));
        this.els.dismissBtn.addEventListener('click', () => this.dismissAlarm());

        if ('Notification' in window && Notification.permission === 'default') {
            Notification.requestPermission();
        }
    }

    addTodo() {
        const text = this.els.input.value.trim();
        if (!text) { this.els.input.focus(); return; }

        let deadline = null;
        if (this.els.slaToggle.checked && this.els.slaInput.value) {
            deadline = new Date(this.els.slaInput.value).getTime();
            if (isNaN(deadline)) deadline = null;
        }

        this.todos.unshift({
            id: Date.now() + Math.random(),
            title: text,
            description: '',
            priority: this.els.priority.value,
            deadline,
            completed: false,
            createdAt: Date.now()
        });

        this.els.input.value = '';
        this.els.slaToggle.checked = false;
        this.els.slaInput.classList.add('hidden');
        this.els.slaInput.value = '';

        this.save();
        this.render();
    }

    openEditModal(id) {
        const todo = this.todos.find(t => t.id === id);
        if (!todo) return;

        this.editingId = id;
        this.els.editTitle.value = todo.title;
        this.els.editDesc.value = todo.description || '';
        this.els.editPriority.value = todo.priority;
        
        if (todo.deadline) {
            const d = new Date(todo.deadline);
            const offset = d.getTimezoneOffset() * 60000;
            this.els.editDeadline.value = new Date(d - offset).toISOString().slice(0, 16);
        } else {
            this.els.editDeadline.value = '';
        }

        this.els.editModal.classList.add('active');
        setTimeout(() => this.els.editTitle.focus(), 100);
    }

    closeEditModal() {
        this.els.editModal.classList.remove('active');
        this.editingId = null;
    }

    saveEdit() {
        const title = this.els.editTitle.value.trim();
        if (!title) { this.els.editTitle.focus(); return; }

        const todo = this.todos.find(t => t.id === this.editingId);
        if (!todo) return;

        todo.title = title;
        todo.description = this.els.editDesc.value.trim();
        todo.priority = this.els.editPriority.value;
        
        const newDeadline = this.els.editDeadline.value ? new Date(this.els.editDeadline.value).getTime() : null;
        
        if (todo.deadline !== newDeadline) {
            todo.deadline = newDeadline;
            this.alarms.delete(`${todo.id}_warning`);
            this.alarms.delete(`${todo.id}_deadline`);
        }

        this.save();
        this.closeEditModal();
        this.render();
    }

    toggleTodo(id) {
        const t = this.todos.find(x => x.id === id);
        if (t) {
            t.completed = !t.completed;
            if (t.completed) {
                this.alarms.delete(`${id}_warning`);
                this.alarms.delete(`${id}_deadline`);
            }
            this.save();
            this.render();
        }
    }

    deleteTodo(id) {
        if (!confirm('Delete this task?')) return;
        this.todos = this.todos.filter(t => t.id !== id);
        this.alarms.delete(`${id}_warning`);
        this.alarms.delete(`${id}_deadline`);
        this.save();
        this.render();
    }

    save() { localStorage.setItem('todos_v7', JSON.stringify(this.todos)); }

    isTaskDone(todo) {
        return todo.completed || (todo.deadline && todo.deadline <= Date.now());
    }

    getFiltered() {
        let list = [...this.todos];
        
        if (this.searchTerm) {
            list = list.filter(t => t.title.toLowerCase().includes(this.searchTerm) || (t.description && t.description.toLowerCase().includes(this.searchTerm)));
        }

        if (this.filter === 'all' || this.filter === 'active') {
            list = list.filter(t => !this.isTaskDone(t));
        } else if (this.filter === 'done') {
            list = list.filter(t => this.isTaskDone(t));
        }

        return list;
    }

    updateProgress() {
        const total = this.todos.length;
        const done = this.todos.filter(t => this.isTaskDone(t)).length;
        const pct = total === 0 ? 0 : Math.round((done / total) * 100);
        const circ = 2 * Math.PI * 22;
        const offset = circ - (pct / 100) * circ;
        this.els.progressFill.style.strokeDashoffset = offset;
        this.els.progressText.textContent = `${pct}%`;
    }

    getTimeLeft(deadline) {
        const diff = deadline - Date.now();
        if (diff <= 0) return '🚨 OVERDUE';
        const d = Math.floor(diff / 86400000);
        const h = Math.floor((diff % 86400000) / 3600000);
        const m = Math.floor((diff % 3600000) / 60000);
        if (d > 0) return `⏳ ${d}d ${h}h`;
        if (h > 0) return `⏳ ${h}h ${m}m`;
        return `⏳ ${m}m`;
    }

    render() {
        const todos = this.getFiltered();
        this.els.list.innerHTML = '';

        const active = this.todos.filter(t => !this.isTaskDone(t)).length;
        this.els.itemsLeft.textContent = `${active} item${active !== 1 ? 's' : ''} left`;

        this.updateProgress();

        if (todos.length === 0) {
            const msg = this.filter === 'done' ? 'No completed or expired tasks.' : 'Nothing here! Add your first task above.';
            this.els.list.innerHTML = `<li style="justify-content:center;color:var(--text-secondary);font-style:italic;border:none;background:transparent;">${msg}</li>`;
            return;
        }

        todos.forEach(todo => {
            const isDone = this.isTaskDone(todo);
            const li = document.createElement('li');
            li.className = `priority-${todo.priority}${isDone ? ' completed' : ''}`;

            li.innerHTML = `
                <input type="checkbox" ${isDone ? 'checked' : ''} style="width:18px;height:18px;cursor:pointer;accent-color:var(--accent-color);">
                <div class="task-content">
                    <div class="task-title">${this.escapeHtml(todo.title)}</div>
                    ${todo.description ? `<div class="task-desc">${this.escapeHtml(todo.description)}</div>` : ''}
                </div>
                <span class="priority-badge">${todo.priority}</span>
                ${todo.deadline ? `<span class="sla-timer ${todo.deadline <= Date.now() ? 'sla-breached' : ''}">${this.getTimeLeft(todo.deadline)}</span>` : ''}
                <button class="action-btn edit-btn" title="Edit">✏️</button>
                <button class="action-btn delete-btn" title="Delete">✕</button>
            `;

            li.querySelector('input[type="checkbox"]').addEventListener('change', () => this.toggleTodo(todo.id));
            li.querySelector('.task-content').addEventListener('click', () => this.toggleTodo(todo.id));
            li.querySelector('.edit-btn').addEventListener('click', (e) => { e.stopPropagation(); this.openEditModal(todo.id); });
            li.querySelector('.delete-btn').addEventListener('click', (e) => { e.stopPropagation(); this.deleteTodo(todo.id); });

            this.els.list.appendChild(li);
        });
    }

    escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    startAlarmChecker() {
        setInterval(() => this.checkAlarms(), 10000);
        this.checkAlarms();
    }

    checkAlarms() {
        const now = Date.now();
        this.todos.forEach(todo => {
            if (!todo.deadline || todo.completed) return;

            const warningTime = todo.deadline - 15 * 60 * 1000;
            const alarmKeyWarning = `${todo.id}_warning`;
            const alarmKeyDeadline = `${todo.id}_deadline`;

            if (now >= warningTime && now < todo.deadline && !this.alarms.get(alarmKeyWarning)) {
                this.alarms.set(alarmKeyWarning, true);
                this.triggerAlarm(todo, '️ Due in 15 minutes!');
            }

            if (now >= todo.deadline && !this.alarms.get(alarmKeyDeadline)) {
                this.alarms.set(alarmKeyDeadline, true);
                this.triggerAlarm(todo, '🚨 Deadline reached!');
            }
        });
    }

    triggerAlarm(todo, message) {
        this.els.alarmMessage.textContent = message;
        this.els.alarmTask.textContent = todo.title;
        this.els.alarmModal.classList.add('active');
        this.playAlarmSound();

        if ('Notification' in window && Notification.permission === 'granted') {
            new Notification('Pro To-Do Alarm', { body: todo.title, icon: 'icon-192.png' });
        }
    }

    playAlarmSound() {
        if (!this.audioCtx) this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        this.alarmInterval = setInterval(() => {
            const osc = this.audioCtx.createOscillator();
            const gain = this.audioCtx.createGain();
            osc.connect(gain);
            gain.connect(this.audioCtx.destination);
            osc.frequency.value = 880;
            const now = this.audioCtx.currentTime;
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.setValueAtTime(0, now + 0.15);
            osc.start(now);
            osc.stop(now + 0.2);
        }, 1500);
    }

    stopAlarmSound() {
        if (this.alarmInterval) {
            clearInterval(this.alarmInterval);
            this.alarmInterval = null;
        }
    }

    snoozeAlarm(mins) {
        this.dismissAlarm();
        alert(`Alarm snoozed for ${mins} minutes. Edit the task to adjust the deadline precisely.`);
    }

    dismissAlarm() {
        this.stopAlarmSound();
        this.els.alarmModal.classList.remove('active');
    }

    showToast(message) {
        const toast = document.createElement('div');
        toast.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#2d3748;color:white;padding:14px 24px;border-radius:50px;font-weight:600;z-index:5000;animation:slideUp 0.4s ease;';
        toast.textContent = message;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }
}

// Register Service Worker
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js')
        .then(reg => console.log('Service Worker registered'))
        .catch(err => console.log('Service Worker registration failed'));
}

// Initialize app
document.addEventListener('DOMContentLoaded', () => new TodoApp());
</script>
